#-------------------------------------------------------------------------------
# DEFAULT FILES

[[files]]
  stub = 'configs/stubs/golangci.yml'
  source = 'configs/templates/golangci.yml'
  destination = '.golangci.yml'

  #-------------------------------------------------------------------------------
  # MISE

# Install packages
# https://mise.jdx.dev
[[files]]
  stub = 'configs/stubs/.config/mise/conf.d/tools.golang.toml'
  source = 'configs/templates/.config/mise/conf.d/tools.golang.toml'
  destination = '.config/mise/conf.d/tools.golang.toml'

  #-------------------------------------------------------------------------------
  # KIRO DIRECTORY

[[files]]
  stub = 'configs/stubs/.kiro/steering/go-zero-diagnostics.md'
  destination = '.kiro/steering/go-zero-diagnostics.md'

  #-------------------------------------------------------------------------------
  # GITHUB DIRECTORY

  #-------------------------------------------------------------------------------
  # VSCODE DIRECTORY

[[files]]
  stub = 'configs/stubs/.vscode/extensions-golang.toml'
  source = 'configs/templates/.vscode/extensions-golang.toml'
  destination = '.vscode/extensions-golang.toml'

  [files.post_update_hook]
    bash = 'bash .vscode/extensions.sh'

    #-------------------------------------------------------------------------------
    # FILES WITH HOOKS

# Go tools
# https://go.dev/doc/modules/managing-dependencies#tools
[[files]]
  stub = 'configs/stubs/tools/go-tool-golang.sh'
  source = 'configs/templates/tools/go-tool-golang.sh'
  destination = 'tools/go-tool-golang.sh'
  executable = true

  [files.post_update_hook]
    bash = """
tools/go-tool-golang.sh
go mod tidy -modfile go.tools.mod
go get -modfile go.tools.mod -u -t -v ./...
"""
