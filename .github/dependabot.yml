---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
#
# Please see the documentation for all configuration options:
# https://bit.ly/4qeBiwL
#
# See this blog post for suggestions for optimizing your config:
# https://bit.ly/4zaBEZ4

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - '*'
    insecure-external-code-execution: deny
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - '*'
    insecure-external-code-execution: deny
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /tools/configschema
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - '*'
    insecure-external-code-execution: deny
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /tools/regions
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - '*'
    insecure-external-code-execution: deny
    schedule:
      interval: monthly
