##
# tomljson contextlint.config.toml > contextlint.config.json
# aubx contextlint
#
# https://contextlint.dev/docs/rules/ctx-002/
##

'$schema' = 'https://raw.githubusercontent.com/nozomi-koborinai/contextlint/main/schema.json'
include = [
  #
  '.kiro/**/*.md',
  'AGENTS.md',
  'CONTRIBUTING.md',
  'docs/**/*.md',
  'README.md',
  #
]

[[rules]]
  rule = 'tbl002'

[[rules]]
  rule = 'str001'

  [rules.options]
    files = [
      #
      'AGENTS.md',
      'CONTRIBUTING.md',
      'docs/comprehensive.md',
      'docs/quickstart.md',
      'README.md',
      #
    ]

[[rules]]
  rule = 'ref001'

[[rules]]
  rule = 'ref005'

[[rules]]
  rule = 'ref006'

[[rules]]
  rule = 'chk001'
  options = { 'files' = ".kiro/specs/**/tasks.md" }

[[rules]]
  rule = 'ctx001'

[[rules]]
  rule = 'grp002'

  # [[rules]]
  #   rule = 'grp003'
